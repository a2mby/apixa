name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9.15.0 --activate
      - run: corepack pnpm install --frozen-lockfile
      - run: corepack pnpm build
      # Packages, tests, and the tracked example (examples/query-ssr-next).
      - run: corepack pnpm typecheck
      - run: corepack pnpm test
      # Packed tarballs installed into clean projects: Core alone, Core + Mocking, peer ranges,
      # export maps, registration with a duplicated Core, React 18/19 + Vite/Next builds.
      - run: corepack pnpm verify:consumers
