name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Supported Node.js baseline (engines >=22) and the current release.
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9.15.0 --activate
      - run: corepack pnpm install --frozen-lockfile
      - run: corepack pnpm build
      # Module-graph rules: dependency direction, cycles, framework/Node leakage, private imports.
      - run: corepack pnpm check:architecture
      # Built output: runtime exports = declarations = committed snapshot; documented imports exist.
      - run: corepack pnpm check:api
      # Packages, tests, and the tracked example (examples/frontends/query-ssr-next).
      - run: corepack pnpm typecheck
      - run: corepack pnpm test
      # One root tarball in clean projects: framework-free Core/Mocking, identity, declarations,
      # lazy datasets, optional peers, React 18/19 and Vite/Next builds.
      - run: corepack pnpm verify:consumers
      # Real Chromium against an external single-tarball copy of the Next SSR example.
      - name: Install Chromium
        run: npx playwright-core install --with-deps chromium
      - run: corepack pnpm verify:browser
      # workerd (Cloudflare Workers) and the Vercel Edge Runtime, running the packed facade.
      - run: corepack pnpm verify:edge
